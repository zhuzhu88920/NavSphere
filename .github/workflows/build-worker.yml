name: Build NavSphere Worker bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/navsphere/content/navigation.json'
      - 'src/navsphere/content/navigation-default.json'
      - 'src/navsphere/content/videos.json'
      - 'src/navsphere/content/site.json'
      - 'src/navsphere/content/resource-metadata.json'
      - '.workbuddy/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build OpenNext Worker bundle
        run: pnpm exec opennextjs-cloudflare build

      - name: Package build output
        run: tar -czf open-next.tar.gz .open-next

      - uses: actions/upload-artifact@v4
        with:
          name: open-next
          path: open-next.tar.gz
          retention-days: 3
